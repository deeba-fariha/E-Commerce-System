        body {
            background: #f7f7f8;
        }

        .dashboard-wrapper {
            padding: 40px 0 60px;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .dashboard-sidebar {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            height: 100%;

        .dashboard-sidebar h5 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .dashboard-sidebar .nav-link {
            color: #333;
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 6px;
            font-weight: 500;
            transition: 0.2s;
        }

        .dashboard-sidebar .nav-link:hover,
        .dashboard-sidebar .nav-link.active {
            background: #ff6b00;
            color: white;
        }

        /* =========================
           PROFILE CARD
        ========================== */

        .dashboard-content-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        /* =========================
           BLANK PROFILE IMAGE
        ========================== */

        .profile-image-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #f1f1f1;
            border: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #aaa;
            font-size: 42px;
        }

        /* =========================
           FORM
        ========================== */

        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 0, 0.15);
        }

        /* =========================
           BUTTONS
        ========================== */

        .btn-warning {
            background: #ff6b00;
            border-color: #ff6b00;
        }

        .btn-warning:hover {
            background: #e85f00;
            border-color: #e85f00;
        }

        /* =========================
           PASSWORD SECTION
        ========================== */

        #passwordSection {
            display: none;
        }

        /* =========================
           MESSAGE
        ========================== */

        #profileMessage {
            display: none;
            margin-top: 15px;
        }

    </style>

  <!-- Backend URL + shared API helpers (load before any other script) -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
</head>

                    <li class="nav-item">

                        <a

                        </a>

                    <li class="nav-item">

                        <a

        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =========================
         PROFILE JAVASCRIPT
    ========================== -->

   <script>


let currentUser = null;


// ===============================
// LOAD USER DATA
// ===============================

document.addEventListener("DOMContentLoaded",()=>{


    currentUser = JSON.parse(
        localStorage.getItem("apexmart_user")
    );


    if(!currentUser){

        alert("Please login first");
        window.location.href="../account/login.html";
        return;

    }


    // Show existing login data

    document.getElementById("fullName").value =
        currentUser.first_name;


    document.getElementById("lastName").value =
        currentUser.last_name;


    document.getElementById("email").value =
        currentUser.email;



    document.getElementById("profileHeaderName").innerText =
        currentUser.first_name + " " + currentUser.last_name;



    // initially disable editing

    setEditMode(false);


});





// ===============================
// EDIT PROFILE BUTTON
// ===============================


document
.getElementById("editProfileBtn")
.addEventListener("click",()=>{


    setEditMode(true);


});




// ===============================
// ENABLE / DISABLE EDIT
// ===============================


function setEditMode(status){


    document.getElementById("fullName").disabled =
        !status;


    document.getElementById("lastName").disabled =
        !status;


    document.getElementById("email").disabled =
        !status;



    if(status){

        document.getElementById("passwordSection")
        .style.display="block";

    }
    else{

        document.getElementById("passwordSection")
        .style.display="none";

    }


}





// ===============================
// SAVE PROFILE UPDATE
// ===============================


document
.getElementById("saveChangesBtn")
.addEventListener("click",async()=>{


    const updateData = {


        first_name:
        document.getElementById("fullName").value,


        last_name:
        document.getElementById("lastName").value,


        email:
        document.getElementById("email").value,


        password:
        document.getElementById("password").value || null


    };



    try{


        const result = await apiFetch(

            `/customer/profile/${currentUser.id}`,

            {

                method:"PUT",

                body:updateData

            }

        );



        // update local storage

        localStorage.setItem(

            "apexmart_user",

            JSON.stringify(result)

        );



        currentUser = result;



        document.getElementById("profileHeaderName")
        .innerText =
        result.first_name+" "+result.last_name;



        showMessage(
            "Profile updated successfully!",
            "success"
        );



        document.getElementById("password").value="";


        setEditMode(false);



    }

    catch(error){


        showMessage(
            apiErrorMessage(error, "Profile update failed."),
            "danger"
        );


    }



});







// ===============================
// MESSAGE
// ===============================


function showMessage(message,type){


    const box =
    document.getElementById("profileMessage");


    box.className =
    "alert alert-"+type;


    box.innerText = message;


    box.style.display="block";



    setTimeout(()=>{


        box.style.display="none";


    },3000);



}





// Logout is handled by js/auth.js (data-auth-logout)



</script>
