<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Mart — Admin Login</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff5e00'><path d='M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z'/></svg>">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Shared site CSS (color variables, form-control-custom, btn-orange etc.) -->
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      min-height: 100vh;
      background: #1B1D22;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }
    .admin-brand-mark {
      width: 42px;
      height: 42px;
      background: #ff5e00;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .admin-brand-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1B1D22;
      letter-spacing: -0.3px;
    }
    .admin-brand-text span {
      color: #ff5e00;
    }
    .login-heading {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1B1D22;
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-size: 0.85rem;
      color: #6B7280;
      margin-bottom: 1.75rem;
    }
    #loginError {
      display: none;
      margin-bottom: 1rem;
    }
  </style>
  <!-- Backend URL + shared API helpers (load before any other script) -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
</head>
<body>

  <div class="admin-login-card">

    <!-- Brand -->
    <div class="admin-brand">
      <div class="admin-brand-mark">A</div>
      <div class="admin-brand-text">Apex<span>Mart</span> Admin</div>
    </div>

    <h1 class="login-heading">Admin Sign In</h1>
    <p class="login-sub">Enter your admin credentials to access the panel.</p>

    <!-- Error message -->
    <div class="alert alert-danger py-2 px-3 small" id="loginError" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-1"></i>
      <span id="loginErrorText">Invalid login credentials. Please try again.</span>
    </div>

    <form id="adminLoginForm" novalidate>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label small fw-bold" for="loginEmail">Email Address</label>
        <input type="email"
               id="loginEmail"
               class="form-control form-control-custom"
               placeholder="admin@example.com"
               autocomplete="email"
               required>
      </div>

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label small fw-bold" for="loginUsername">Username</label>
        <input type="text"
               id="loginUsername"
               class="form-control form-control-custom"
               placeholder="admin"
               autocomplete="username"
               required>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="form-label small fw-bold" for="loginPassword">Password</label>
        <div class="input-group">
          <input type="password"
                 id="loginPassword"
                 class="form-control form-control-custom"
                 placeholder="Enter password"
                 autocomplete="current-password"
                 required>
          <button class="btn btn-outline-secondary border-start-0"
                  type="button"
                  id="togglePassword"
                  tabindex="-1"
                  aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-orange w-100 py-2 fw-bold" id="loginBtn">
        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
        <span id="loginBtnSpinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Signing in…
        </span>
      </button>

    </form>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Login logic -->
  <script src="../js/auth.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
