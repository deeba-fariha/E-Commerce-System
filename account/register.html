    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexMart - Create Account</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff5e00'><path d='M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48-.0.55-.45 1-1 1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 1.99-.9 1.99-2-.89-2-1.99-2z'/></svg>">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>

    <div class="modal fade custom-modal" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0">Create Account</h5>

            <a href="../main/index.html" class="btn-close" aria-label="Close"></a>
            </div>

            <div class="modal-body p-4">

            <form onsubmit="event.preventDefault(); handleAuthSubmit('register');">

                <!-- First & Last Name -->
                <div class="row g-2 mb-3">

                <div class="col-6">
                    <label class="form-label small fw-bold">First Name</label>
                    <input type="text"
                        class="form-control form-control-custom"
                        placeholder="Jane"
                        required>
                </div>

                <div class="col-6">
                    <label class="form-label small fw-bold">Last Name</label>
                    <input type="text"
                        class="form-control form-control-custom"
                        placeholder="Doe"
                        required>
                </div>

                </div>

                <!-- Email -->
                <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email"
                        class="form-control form-control-custom"
                        placeholder="jane.doe@example.com"
                        required>
                </div>

                <!-- Password -->
                <div class="mb-3">

                <label class="form-label small fw-bold">
                    Create Password
                </label>

                <div class="input-group">

                    <input type="password"
                        name="password"
                        id="registerPassword"
                        class="form-control form-control-custom"
                        placeholder="Enter password"
                        required>

                    <button type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword('registerPassword', 'registerPasswordIcon')">

                    <i class="bi bi-eye" id="registerPasswordIcon"></i>

                    </button>

                </div>
                </div>

                <!-- Terms -->
                <div class="form-check mb-3">

                <input class="form-check-input"
                        type="checkbox"
                        id="termsCheck"
                        required>

                <label class="form-check-label small" for="termsCheck">
                    I agree to the Terms of Service & Privacy Policy
                </label>

                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-orange w-100 py-2">
                <i class="bi bi-person-plus-fill"></i>
                Create Account
                </button>

                <!-- Login Link -->
                <div class="text-center mt-3">
                <span class="small text-muted">Already have an account?</span>
                <a href="login.html"
                    class="small text-warning fw-bold text-decoration-none">
                    Login now
                </a>
                </div>

            </form>

            </div>
        </div>
        </div>
    </div>


    <script>

        function togglePassword(passwordId, iconId) {
        const password = document.getElementById(passwordId);
        const icon = document.getElementById(iconId);

        if (password.type === "password") {
            password.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        }
        else {
            password.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const authModal = document.getElementById('authModal');

        if (authModal) {
            bootstrap.Modal.getOrCreateInstance(authModal).show();
        }
        });
    </script>

    </body>
    </html>
