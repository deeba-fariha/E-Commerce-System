
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Status - ApexMart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div id="sellerPage" data-page="product-status">

    <section class="dashboard-view-pane active">

        <div class="dash-card">

            <!-- Header -->
            <div class="d-flex flex-column flex-md-row
                        justify-content-between gap-3 mb-4 pb-2 border-bottom">

                <div>
                    <h4 class="fw-bold text-dark mb-1">
                        Admin Approval & Verification Status
                    </h4>

                    <p class="text-muted small mb-0">
                        Track your product approval status.
                    </p>
                </div>

                <!-- Status Filters -->
                <div class="d-flex gap-2 flex-wrap">

                    <button
                        class="status-pill-btn active"
                        data-status="all"
                        onclick="filterProducts('all')">
                        All (<span id="countAll">0</span>)
                    </button>

                    <button
                        class="status-pill-btn"
                        data-status="approved"
                        onclick="filterProducts('approved')">
                        Approved (<span id="countApproved">0</span>)
                    </button>

                    <button
                        class="status-pill-btn"
                        data-status="pending"
                        onclick="filterProducts('pending')">
                        Pending (<span id="countPending">0</span>)
                    </button>

                    <button
                        class="status-pill-btn"
                        data-status="rejected"
                        onclick="filterProducts('rejected')">
                        Rejected (<span id="countRejected">0</span>)
                    </button>

                </div>

            </div>


            <!-- Product Table -->
            <div class="dash-table-wrap table-responsive">

                <table class="dash-table">

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Regular Price</th>
                            <th>Sale Price</th>
                            <th>Current Stock</th>
                            <th>Admin Status</th>
                        </tr>
                    </thead>

                    <tbody id="statusTableBody"></tbody>

                </table>

            </div>

        </div>

    </section>

</div>


<!-- Existing Seller JavaScript -->
<script src="../js/seller-db.js"></script>
<script src="../js/seller-layout.js"></script>
<script src="../js/seller-dashboard.js"></script>


<script>

const PRODUCT_API_URL = "http://127.0.0.1:8000/api/products";

let products = [];
let currentFilter = "all";


// =========================================================
// GET LOGGED-IN SELLER ID
// =========================================================

function getSellerId() {

    const sellerId = localStorage.getItem("seller_id");

    if (!sellerId) {
        return null;
    }

    const id = Number(sellerId);

    return Number.isInteger(id) ? id : null;
}


// =========================================================
// LOAD PRODUCTS
// =========================================================

async function loadProducts() {

    const tableBody = document.getElementById("statusTableBody");

    const sellerId = getSellerId();

    if (!sellerId) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-danger py-4">
                    Seller ID not found. Please log in again.
                </td>
            </tr>
        `;

        return;
    }


    try {

        const response = await fetch(
            `${PRODUCT_API_URL}/seller/${sellerId}`
        );


        if (!response.ok) {

            const errorData = await response.json().catch(() => null);

            throw new Error(
                errorData?.detail || "Failed to load products."
            );
        }


        products = await response.json();


        updateCounts();
        renderProducts();


    } catch (error) {

        console.error("Failed to load products:", error);

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-danger py-4">
                    Failed to load products.
                    <br>
                    <small>${escapeHtml(error.message)}</small>
                </td>
            </tr>
        `;
    }
}


// =========================================================
// UPDATE STATUS COUNTS
// =========================================================

function updateCounts() {

    document.getElementById("countAll").textContent =
        products.length;

    document.getElementById("countApproved").textContent =
        products.filter(p => getStatus(p) === "approved").length;

    document.getElementById("countPending").textContent =
        products.filter(p => getStatus(p) === "pending").length;

    document.getElementById("countRejected").textContent =
        products.filter(p => getStatus(p) === "rejected").length;
}


// =========================================================
// GET PRODUCT STATUS
// =========================================================

function getStatus(product) {

    return String(product.status || "pending")
        .trim()
        .toLowerCase();
}


// =========================================================
// FILTER PRODUCTS
// =========================================================

function filterProducts(status) {

    currentFilter = status;

    document
        .querySelectorAll(".status-pill-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.status === status
            );

        });


    renderProducts();
}


// =========================================================
// RENDER PRODUCTS
// =========================================================

function renderProducts() {

    const tableBody =
        document.getElementById("statusTableBody");


    let filteredProducts = products;


    if (currentFilter !== "all") {

        filteredProducts = products.filter(
            product => getStatus(product) === currentFilter
        );

    }


    if (filteredProducts.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-muted py-4">
                    No products found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML =
        filteredProducts
            .map(createProductRow)
            .join("");
}


// =========================================================
// CREATE PRODUCT ROW
// =========================================================

function createProductRow(product) {

    const status = getStatus(product);


    let statusClass = "bg-secondary";


    if (status === "approved") {

        statusClass = "bg-success";

    } else if (status === "pending") {

        statusClass = "bg-warning text-dark";

    } else if (status === "rejected") {

        statusClass = "bg-danger";
    }


    const imageUrl = product.image
    ? (
        product.image.startsWith("http")
            ? product.image
            : "http://127.0.0.1:8000" + product.image
      )
    : "";


const image = imageUrl
    ? `
        <img
            src="${escapeHtml(imageUrl)}"
            alt="${escapeHtml(product.name)}"
            width="50"
            height="50"
            style="
                object-fit: contain;
                border-radius: 8px;
                margin-right: 10px;
            "
            onerror="this.style.display='none';"
        >
      `
    : "";


    return `
        <tr>

            <td>

                <div class="d-flex align-items-center">

                    ${image}

                    <div>

                        <div class="fw-semibold">
                            ${escapeHtml(product.name)}
                        </div>

                        <small class="text-muted">
                            ID: ${product.id}
                        </small>

                    </div>

                </div>

            </td>


            <td>
                ${escapeHtml(product.category)}
            </td>


            <td>
                $${formatPrice(product.oldPrice)}
            </td>


            <td>
                $${formatPrice(product.price)}
            </td>


            <td>
                ${product.stock ?? 0}
            </td>


            <td>

                <span class="badge ${statusClass}">
                    ${capitalize(status)}
                </span>

            </td>

        </tr>
    `;
}


// =========================================================
// FORMAT PRICE
// =========================================================

function formatPrice(value) {

    const price = Number(value);

    return Number.isFinite(price)
        ? price.toFixed(2)
        : "0.00";
}


// =========================================================
// CAPITALIZE
// =========================================================

function capitalize(value) {

    const text = String(value || "");

    return text.charAt(0).toUpperCase()
        + text.slice(1).toLowerCase();
}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// PAGE LOAD

document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);

</script>

</body>
</html>
