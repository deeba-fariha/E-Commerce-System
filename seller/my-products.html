    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - ApexMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    </head>

    <body>

    <div id="sellerPage" data-page="my-products">
        <section class="dashboard-view-pane active">

            <div class="dash-card">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h4 class="fw-bold text-dark mb-1">
                            My Products Catalog
                        </h4>

                        <p class="text-muted small mb-0">
                            Manage listings, update stock, or delete products.
                        </p>
                    </div>

                    <a
                        class="btn btn-orange"
                        href="add-product.html">
                        <i class="bi bi-plus-lg me-1"></i>
                        Add New Product
                    </a>

                </div>

                <!-- Search and Filter -->
                <div class="row g-3 mb-3">

                    <!-- Search -->
                    <div class="col-md-6">

                        <input
                            type="text"
                            class="form-control form-control-dash"
                            id="myProductsSearchInput"
                            placeholder="Search by name, brand, or Product ID..."
                            oninput="handleMyProductsSearch()">

                    </div>

                    <!-- Category Filter -->
                    <div class="col-md-4">

                        <select class="form-select form-control-dash" id="myProductsCategoryFilter" onchange="handleMyProductsSearch()">

                            <option value="all">All Categories</option>

                            <option value="electronics">Electronics</option>
                            <option value="audio">Audio & Sound</option>
                            <option value="wearables">Wearables</option>
                            <option value="fashion">Fashion & Bags</option>
                            <option value="home">Home & Living</option>

                        </select>

                    </div>

                    <!-- Product Count -->
                    <div class="col-md-2">
                        <span class="small text-muted fw-bold" id="myProductsCountText"></span>
                    </div>

                </div>
                <!-- Products Table -->
                <div class="dash-table-wrap table-responsive">
                    <table class="dash-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Brand & Category</th>
                                <th>Pricing</th>
                                <th>Stock Inventory</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="myProductsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

<!-- Edit Product Modal -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold">
                    Edit Product
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>
            </div>

            <form id="editProductForm">

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="editProductId">

                    <div class="row g-3">

                        <!-- Product Name -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Product Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editProductName"
                                required>
                        </div>

                        <!-- Brand -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Brand
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editProductBrand">
                        </div>

                        <!-- Category -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <select
                                class="form-select"
                                id="editProductCategory"
                                required>

                                <option value="electronics">
                                    Electronics
                                </option>

                                <option value="audio">
                                    Audio & Sound
                                </option>

                                <option value="wearables">
                                    Wearables
                                </option>

                                <option value="fashion">
                                    Fashion & Bags
                                </option>

                                <option value="home">
                                    Home & Living
                                </option>

                            </select>
                        </div>

                        <!-- Badge -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Badge
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editProductBadge">
                        </div>

                        <!-- Stock -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Stock
                            </label>

                            <input
                                type="number"
                                min="0"
                                class="form-control"
                                id="editProductStock"
                                required>
                        </div>

                        <!-- Old Price -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Old Price
                            </label>

                            <input
                                type="number"
                                min="0"
                                step="0.05"
                                class="form-control"
                                id="editProductOldPrice"
                                oninput="calculateEditPrice()">
                        </div>

                        <!-- Discount -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Discount
                            </label>

                            <input
                                type="number"
                                min="0"
                                step="0.01"
                                class="form-control"
                                id="editProductDiscount"
                                oninput="calculateEditPrice()">
                        </div>

                        <!-- Price -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Price
                            </label>

                            <input
                                type="number"
                                min="0"
                                step="0.01"
                                class="form-control"
                                id="editProductPrice"
                                required>
                        </div>

                        <!-- Image -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Image URL
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="editProductImage">
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="editProductDescription"
                                rows="4"></textarea>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-orange">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Seller JavaScript -->
    <script src="../js/seller-layout.js"></script>
    <script src="../js/seller-dashboard.js"></script>
    <script src="../js/my-products.js"></script>

    </body>
    </html>
