<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders - ApexMart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>
<div id="sellerPage" data-page="orders">

    <section class="dashboard-view-pane active">

        <!-- Customer Orders -->
        <div class="dash-card mb-4">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div>
                    <h4 class="fw-bold text-dark mb-1">
                        Customer Orders
                    </h4>

                    <p class="small text-muted mb-0">
                        Orders placed by customers for your store inventory.
                    </p>
                </div>

                <span class="badge bg-success px-3 py-2">
                    Escrow Secured
                </span>

            </div>

            <div class="dash-table-wrap table-responsive">

                <table class="dash-table">

                    <thead>

                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Product Ordered</th>
                            <th>Quantity</th>
                            <th>Total Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="ordersTableBody">
                    </tbody>

                </table>

            </div>

        </div>

        <!-- Customer Reviews -->
        <div class="dash-card">

            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <div>
                    <h4 class="fw-bold text-dark mb-1">Customer Reviews & Ratings</h4>

                    <p class="small text-muted mb-0">
                        Verified purchaser reviews for your store.
                    </p>
                </div>

                <strong class="fs-5 text-dark">

                    <i class="bi bi-star-fill text-warning"></i>
                    <span id="reviewsAverageRating">4.88</span>

                </strong>

            </div>

            <div id="reviewsListContainer"></div>

        </div>

    </section>

</div>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<!-- Seller JavaScript -->
<script src="../js/seller-layout.js"></script>
<script src="../js/seller-dashboard.js"></script>

</body>
</html>
